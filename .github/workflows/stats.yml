name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"   # Every day at midnight UTC
  workflow_dispatch:        # Manual run

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== Stats Card =====
      - name: Generate Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical&hide_border=true&count_private=true
          path: stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ===== Top Languages Card =====
      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=radical&hide_border=true&layout=compact&langs_count=8
          path: top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ===== Streak Stats Card =====
      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=radical&hide_border=true
          path: streak.svg

      # ===== Commit the generated SVGs =====
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub stats cards"
          git push
